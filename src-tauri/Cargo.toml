[package]
name = "yuna-notes"
version = "1.0.0"
description = "A local-first desktop notebook"
authors = ["Rostha"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "yuna_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
